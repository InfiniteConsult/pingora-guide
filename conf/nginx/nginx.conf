# conf/nginx/nginx.conf

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version for security (and cleaner logs)
    server_tokens off;

    # --- 1. Standard HTTP (Port 80) ---
    # Used for Caching and Header Manipulation lessons
    server {
        listen 80;
        server_name advanced.pingora.local;

        location / {
            return 200 "Response from Advanced Upstream (HTTP)";
            add_header Content-Type text/plain;
        }

        # For Module 6: Caching
        location /cache-control {
            return 200 "This response is cacheable for 60 seconds.";
            add_header Cache-Control "public, max-age=60";
            add_header ETag "v1.0.0";
        }
    }

    # --- 2. Standard HTTPS (Port 443) ---
    # Used for TLS Termination and SNI lessons
    server {
        listen 443 ssl;
        http2 on; # Enable HTTP/2 for Module 2
        server_name advanced.pingora.local;

        ssl_certificate     /etc/nginx/certs/upstream.crt;
        ssl_certificate_key /etc/nginx/certs/upstream.key;

        location / {
            return 200 "Response from Advanced Upstream (HTTPS + HTTP/2)";
            add_header Content-Type text/plain;
        }
    }

    # --- 3. Mutual TLS (Port 8443) ---
    # Used for Module 3: mTLS Upstreams
    server {
        listen 8443 ssl;
        server_name advanced.pingora.local;

        ssl_certificate     /etc/nginx/certs/upstream.crt;
        ssl_certificate_key /etc/nginx/certs/upstream.key;

        # Enforce Client Certificate
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        location / {
            return 200 "Response from mTLS Protected Upstream. Hello, Authenticated Client!";
            add_header Content-Type text/plain;
        }
    }

    # --- 4. H2C (HTTP/2 Cleartext) (Port 8081) ---
    # Used for Module 2: H2C Support
    server {
        listen 8081;
        http2 on;
        server_name advanced.pingora.local;

        location / {
            return 200 "Response from Advanced Upstream (H2C - Cleartext HTTP/2)";
            add_header Content-Type text/plain;
        }
    }
}