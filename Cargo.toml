[package]
name = "pingora-guide"
version = "0.1.0"
edition = "2024"

[dependencies]
pingora = { version = "0.6.0", features = ["openssl", "proxy", "lb", "cache"] }

tokio = { version = "1.49.0", features = ["full"] }
async-trait = "0.1.89"
bytes = "1.11.0"
http = "1.4.0"

log = "0.4.29"
env_logger = "0.11.8"

clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9"

thiserror = "2.0.17"
